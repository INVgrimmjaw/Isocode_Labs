server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Every kilobyte counts on 3G, and this also compresses the API's JSON.
    gzip on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # The browser talks to one origin, so there is no CORS and the session cookie just works.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have a hash in their name, so a phone never has to ask for them twice.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri /index.html;
    }
}
