# Local Postgres only. Bound to loopback with trust auth so there is no password to manage or leak.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: peti
      POSTGRES_DB: peti
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peti -d peti"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
